name: 全量渐进式总控搬运（每次补齐15个历史 + 全量源码/Wiki/镜像追新）

on:
  # 每天定时跑 2 次（北京时间 02:00 和 14:00），每次自动补齐 15 个历史版本直至全量搬完
  schedule:
    - cron: '0 6,18 * * *'
  push:
    paths:
      - 'repos.txt'
  workflow_dispatch:
    inputs:
      batch_size:
        description: '本次每个项目补齐几个未同步的历史 Release（默认 15，想一次多补可填 15）'
        required: true
        default: '15'

jobs:
  batch-mirror:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: 读取搬运清单
        uses: actions/checkout@v4

      - name: 登录 GitHub 镜像仓库与 Git 认证
        env:
          GH_TOKEN: ${{ secrets.MIRROR_TOKEN }}
        run: |
          echo "${{ secrets.MIRROR_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          git config --global credential.helper '!f() { echo "username=x-access-token"; echo "password=${GH_TOKEN}"; }; f'

      - name: 设置多架构并发构建工具
        uses: docker/setup-buildx-action@v3

      - name: 全量渐进补齐清单中的所有项目
        env:
          GH_TOKEN: ${{ secrets.MIRROR_TOKEN }}
          OWNER: ${{ github.repository_owner }}
          BATCH_SIZE: ${{ github.event.inputs.batch_size || '15' }}
        run: |
          grep -v '^#' repos.txt | grep -v '^[[:space:]]*$' | while IFS='|' read -r RAW_GH RAW_DOCKER RAW_TARGET RAW_COUNT; do
            GH_SRC=$(echo "$RAW_GH" | xargs)
            DOCKER_SRC=$(echo "$RAW_DOCKER" | xargs)
            TARGET=$(echo "$RAW_TARGET" | xargs)
            COUNT=$(echo "$RAW_COUNT" | xargs)
            COUNT=${COUNT:-5}

            echo "=================================================="
            echo "🚀 开始同步项目: $TARGET"

            # 1. 创建公开仓库（开启 Wiki，并关闭子仓库自身 Actions 总开关杜绝原作者脚本乱跑报错）
            if [ "$GH_SRC" != "none" ] && [ -n "$GH_SRC" ] && [[ "$GH_SRC" != postgres/* ]] && [[ "$GH_SRC" != redis/* ]] && [[ "$GH_SRC" != nginx/* ]]; then
              if ! gh repo view "$OWNER/$TARGET" >/dev/null 2>&1; then
                echo "📦 创建公开仓库: $OWNER/$TARGET"
                gh repo create "$OWNER/$TARGET" --public --enable-wiki || true
                sleep 10
              else
                gh repo edit "$OWNER/$TARGET" --enable-wiki || true
              fi

              # 关闭子仓库自身的 Actions 总开关
              gh api -X PUT "repos/${OWNER}/${TARGET}/actions/permissions" -F enabled=false >/dev/null 2>&1 || true

              # 2. 完整同步全部源码、全部分支、全部 Tags（含 README 部署与变量说明）
              echo "⚡ 全量同步源码与部署文档: $GH_SRC -> $OWNER/$TARGET"
              rm -rf temp_repo.git
              SRC_URL=$(printf '%s://%s/%s.git' 'https' 'github.com' "$GH_SRC")
              DST_URL=$(printf '%s://%s/%s/%s.git' 'https' 'github.com' "$OWNER" "$TARGET")
              if git clone --mirror "$SRC_URL" temp_repo.git; then
                git -C temp_repo.git push --mirror "$DST_URL" >/dev/null 2>&1 || true
                rm -rf temp_repo.git
              fi

              # 3. 全量同步官方 Wiki 百科文档
              rm -rf temp_wiki.git
              WIKI_SRC=$(printf '%s://%s/%s.wiki.git' 'https' 'github.com' "$GH_SRC")
              WIKI_DST=$(printf '%s://%s/%s/%s.wiki.git' 'https' 'github.com' "$OWNER" "$TARGET")
              if git clone --mirror "$WIKI_SRC" temp_wiki.git >/dev/null 2>&1; then
                echo "📚 同步官方 Wiki 文档..."
                git -C temp_wiki.git push --mirror "$WIKI_DST" >/dev/null 2>&1 || true
                rm -rf temp_wiki.git
              fi

              # 4. 智能对比：获取官方所有 Releases（含预发布/测试版状态），每次按序补齐 BATCH_SIZE 个并 100% 还原官方标签
              echo "🔍 检查未同步的 Releases（本轮最多补齐 $BATCH_SIZE 个）..."
              REAL_LATEST=$(gh release view --repo "$GH_SRC" --json tagName -q '.tagName' 2>/dev/null || true)
              EXISTING_TAGS=$(gh release list --repo "$OWNER/$TARGET" --limit 200 --json tagName -q '.[].tagName' 2>/dev/null || true)

              # 获取官方最近 200 个版本的 标签名 与 是否为预发布测试版(isPrerelease)
              SRC_RELEASES_JSON=$(gh release list --repo "$GH_SRC" --limit 200 --json tagName,isPrerelease 2>/dev/null || echo "[]")

              ADDED=0
              for ROW in $(echo "$SRC_RELEASES_JSON" | jq -c '.[]'); do
                if [ "$ADDED" -ge "$BATCH_SIZE" ]; then
                  break
                fi

                TAG=$(echo "$ROW" | jq -r '.tagName')
                IS_PRE=$(echo "$ROW" | jq -r '.isPrerelease')

                # 已存在的版本跳过，但顺手校准一次它的预发布状态
                if echo "$EXISTING_TAGS" | grep -Fxq "$TAG"; then
                  if [ "$IS_PRE" = "true" ]; then
                    gh release edit "$TAG" --repo "$OWNER/$TARGET" --prerelease >/dev/null 2>&1 || true
                  fi
                  continue
                fi

                # 根据官方属性决定是打上 Pre-release 测试标，还是保持普通正式版（且绝不抢占 Latest）
                EXTRA_FLAGS="--latest=false"
                LABEL_TEXT="正式版"
                if [ "$IS_PRE" = "true" ]; then
                  EXTRA_FLAGS="--prerelease --latest=false"
                  LABEL_TEXT="Pre-release 测试版"
                fi

                echo "  📥 正在补齐 Release [$LABEL_TEXT]: $TAG ($((ADDED+1))/$BATCH_SIZE)"
                rm -rf release_assets && mkdir -p release_assets
                gh release download "$TAG" --repo "$GH_SRC" --dir release_assets 2>/dev/null || true
                BODY=$(gh release view "$TAG" --repo "$GH_SRC" --json body -q '.body' 2>/dev/null || echo "Mirrored release $TAG")

                if [ "$(ls -A release_assets)" ]; then
                  gh release create "$TAG" release_assets/* --repo "$OWNER/$TARGET" --title "$TAG" --notes "$BODY" $EXTRA_FLAGS >/dev/null 2>&1 || true
                else
                  gh release create "$TAG" --repo "$OWNER/$TARGET" --title "$TAG" --notes "$BODY" $EXTRA_FLAGS >/dev/null 2>&1 || true
                fi

                # 顺手把这个历史版本对应的 Docker 镜像也一并补齐
                if [ "$DOCKER_SRC" != "none" ] && [ -n "$DOCKER_SRC" ]; then
                  TARGET_LOWER=$(echo "$TARGET" | tr '[:upper:]' '[:lower:]')
                  CLEAN_VER="${TAG#v}"
                  docker buildx imagetools create -t "ghcr.io/${OWNER}/${TARGET_LOWER}:${TAG}" "${DOCKER_SRC}:${TAG}" >/dev/null 2>&1 || true
                  docker buildx imagetools create -t "ghcr.io/${OWNER}/${TARGET_LOWER}:${CLEAN_VER}" "${DOCKER_SRC}:${CLEAN_VER}" >/dev/null 2>&1 || true
                fi

                ADDED=$((ADDED+1))
              done

              # 最终校准：强制把官方真正的最新正式版设为 Latest 绿标，并解除旧版本的误标
              if [ -n "$REAL_LATEST" ]; then
                gh release edit "$REAL_LATEST" --repo "$OWNER/$TARGET" --latest --prerelease=false >/dev/null 2>&1 || true
              fi
              echo "  ✅ 本轮已为 $TARGET 补齐 $ADDED 个历史 Release（全部标签已严格对齐官方）"
            fi

            # 5. 确保最新镜像与常用版本标签始终保持同步
            if [ "$DOCKER_SRC" != "none" ] && [ -n "$DOCKER_SRC" ]; then
              TARGET_LOWER=$(echo "$TARGET" | tr '[:upper:]' '[:lower:]')
              if [[ "$DOCKER_SRC" != *.* ]]; then
                API_URL=$(printf '%s://%s/v2/repositories/%s/tags?page_size=%s&ordering=last_updated' 'https' 'hub''.''docker.com' "$DOCKER_SRC" "$COUNT")
                TAGS=$(curl -s "$API_URL" | jq -r '.results[].name' 2>/dev/null || true)
                TAGS=$(printf "latest\n%s" "$TAGS" | sort -u)
              else
                TAGS="latest stable 6.6.5 0.17.0 libtorrentv1 RELEASE.2025-04-22T22-12-26Z"
              fi

              echo "$TAGS" | xargs -I {} -P 6 bash -c '
                docker buildx imagetools create -t "ghcr.io/$2/$3:{}" "$1:{}" >/dev/null 2>&1 || true
              ' _ "$DOCKER_SRC" "$OWNER" "$TARGET_LOWER"
            fi
          done

      - name: 自动记录运行时间（防止 60 天无操作停用）
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          date -u "+Last run: %Y-%m-%d %H:%M:%S UTC" > .github/.last_run
          git add .github/.last_run
          git commit -m "chore: keep workflow alive [skip ci]" || exit 0
          git push

