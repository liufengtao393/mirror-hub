name: 一键极速批量搬运（完整源码 + Wiki + Releases + 镜像）

on:
  schedule:
    - cron: '0 19 * * *'
  push:
    paths:
      - 'repos.txt'
  workflow_dispatch:

jobs:
  batch-mirror:
    runs-on: ubuntu-latest
    steps:
      - name: 读取搬运清单
        uses: actions/checkout@v4

      - name: 登录 GitHub 镜像仓库与 Git 认证
        env:
          GH_TOKEN: ${{ secrets.MIRROR_TOKEN }}
        run: |
          echo "${{ secrets.MIRROR_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          git config --global credential.helper '!f() { echo "username=x-access-token"; echo "password=${GH_TOKEN}"; }; f'

      - name: 设置多架构并发构建工具
        uses: docker/setup-buildx-action@v3

      - name: 极速批量搬运清单中的所有项目
        env:
          GH_TOKEN: ${{ secrets.MIRROR_TOKEN }}
          OWNER: ${{ github.repository_owner }}
        run: |
          grep -v '^#' repos.txt | grep -v '^[[:space:]]*$' | while IFS='|' read -r RAW_GH RAW_DOCKER RAW_TARGET RAW_COUNT; do
            GH_SRC=$(echo "$RAW_GH" | xargs)
            DOCKER_SRC=$(echo "$RAW_DOCKER" | xargs)
            TARGET=$(echo "$RAW_TARGET" | xargs)
            COUNT=$(echo "$RAW_COUNT" | xargs)
            COUNT=${COUNT:-5}

            echo "=================================================="
            echo "🚀 开始搬运项目: $TARGET"

            # 1. 创建公开仓库（不加默认README，保持纯净空仓库以便 --mirror 完整推送）
            if [ "$GH_SRC" != "none" ] && [ -n "$GH_SRC" ] && [[ "$GH_SRC" != postgres/* ]] && [[ "$GH_SRC" != redis/* ]] && [[ "$GH_SRC" != nginx/* ]]; then
              if ! gh repo view "$OWNER/$TARGET" >/dev/null 2>&1; then
                echo "📦 自动创建公开仓库: $OWNER/$TARGET (等待12秒防限流)"
                gh repo create "$OWNER/$TARGET" --public --enable-wiki || true
                sleep 12
              else
                gh repo edit "$OWNER/$TARGET" --enable-wiki || true
              fi

              # 2. 使用 printf 拼接地址 + git clone --mirror 完整镜像克隆源码与 Tags
              echo "⚡ 镜像同步源码: $GH_SRC -> $OWNER/$TARGET"
              rm -rf temp_repo.git
              SRC_URL=$(printf '%s://%s/%s.git' 'https' 'github.com' "$GH_SRC")
              DST_URL=$(printf '%s://%s/%s/%s.git' 'https' 'github.com' "$OWNER" "$TARGET")
              if git clone --mirror "$SRC_URL" temp_repo.git; then
                git -C temp_repo.git push --mirror "$DST_URL" || echo "⚠️ 部分受保护引用推送跳过"
                rm -rf temp_repo.git
              else
                echo "❌ 源码克隆失败: $SRC_URL"
              fi

              # 3. 同步官方 Wiki 百科文档（如果存在）
              rm -rf temp_wiki.git
              WIKI_SRC=$(printf '%s://%s/%s.wiki.git' 'https' 'github.com' "$GH_SRC")
              WIKI_DST=$(printf '%s://%s/%s/%s.wiki.git' 'https' 'github.com' "$OWNER" "$TARGET")
              if git clone --mirror "$WIKI_SRC" temp_wiki.git >/dev/null 2>&1; then
                echo "📚 发现官方 Wiki，正在同步..."
                git -C temp_wiki.git push --mirror "$WIKI_DST" >/dev/null 2>&1 || echo "  ℹ️ 需先在网页点开 Wiki 标签初始化后再同步"
                rm -rf temp_wiki.git
              fi

              # 4. 同步最新 Release 安装包与更新日志
              LATEST_TAG=$(gh release view --repo "$GH_SRC" --json tagName -q '.tagName' 2>/dev/null || true)
              if [ -n "$LATEST_TAG" ] && ! gh release view "$LATEST_TAG" --repo "$OWNER/$TARGET" >/dev/null 2>&1; then
                echo "📥 搬运最新 Release 安装包: $LATEST_TAG"
                rm -rf release_assets && mkdir -p release_assets
                gh release download "$LATEST_TAG" --repo "$GH_SRC" --dir release_assets || true
                BODY=$(gh release view "$GH_SRC" --repo "$GH_SRC" --json body -q '.body' 2>/dev/null || echo "Auto mirrored release")
                if [ "$(ls -A release_assets)" ]; then
                  gh release create "$LATEST_TAG" release_assets/* --repo "$OWNER/$TARGET" --title "$LATEST_TAG" --notes "$BODY" || true
                else
                  gh release create "$LATEST_TAG" --repo "$OWNER/$TARGET" --title "$LATEST_TAG" --notes "$BODY" || true
                fi
              fi
            fi

            # 5. 并发无损搬运 Docker 镜像
            if [ "$DOCKER_SRC" != "none" ] && [ -n "$DOCKER_SRC" ]; then
              echo "🐳 并发搬运镜像: $DOCKER_SRC"
              TARGET_LOWER=$(echo "$TARGET" | tr '[:upper:]' '[:lower:]')
              
              if [[ "$DOCKER_SRC" != *.* ]]; then
                API_URL=$(printf '%s://%s/v2/repositories/%s/tags?page_size=%s&ordering=last_updated' 'https' 'hub''.''docker.com' "$DOCKER_SRC" "$COUNT")
                TAGS=$(curl -s "$API_URL" | jq -r '.results[].name' 2>/dev/null || true)
                TAGS=$(printf "latest\n%s" "$TAGS" | sort -u)
              else
                TAGS="latest stable 6.6.5 0.17.0 libtorrentv1 RELEASE.2025-04-22T22-12-26Z"
              fi

              echo "$TAGS" | xargs -I {} -P 6 bash -c '
                if docker buildx imagetools create -t "ghcr.io/$2/$3:{}" "$1:{}" >/dev/null 2>&1; then
                  echo "  ✅ 镜像已同步: $3:{}"
                fi
              ' _ "$DOCKER_SRC" "$OWNER" "$TARGET_LOWER"
            fi
          done
